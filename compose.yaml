services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ethics
      POSTGRES_USER: ethics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ethics -d ethics"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
