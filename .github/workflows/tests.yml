name: Linux and Windows compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install complete cross-platform lockfile
        run: python -m pip install -r requirements.lock
      - name: Check installed dependencies
        run: python -m pip check
      - name: Migrate database
        run: python -m alembic upgrade head
      - name: Check model and migration agreement
        run: python -m alembic check
      - name: Install test browser
        run: python -m playwright install chromium
      - name: Test API, Windows file handles, and browser workflow
        env:
          USE_PLAYWRIGHT_BROWSER: '1'
        run: python -m pytest -q
  infrastructure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ethics
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ethics
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ethics" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ethics:test@localhost:5432/ethics
      TEST_DATABASE_URL: postgresql+psycopg://ethics:test@localhost:5432/ethics
      TEST_REDIS_URL: redis://localhost:6379/0
      USE_PLAYWRIGHT_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m alembic upgrade head
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
